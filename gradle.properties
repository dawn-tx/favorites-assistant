org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# 单模块工程，关掉并行：debug/release 两条链会并发跑同一个 Room KSP 任务，
# 之前因此把 app/schemas 写出半截空文件，Room 读它报 "Empty schema file"
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 收藏数据同步后台地址（可被 App 内设置页覆盖，无需重新编译）
SYNC_ENDPOINT=http://10.0.2.2:8787/api/v1
