# Cloudflare Worker 部署配置（部署要点见 README）。
#
# 绑定：
#   DB        —— D1：收藏、资产、任务元数据
#
# 媒体备份不放 Worker 侧：默认所有 backup 上传都回源 Worker 的代理/合成地址，
# 再由外部存储复制；切片由 Worker 合成 init + 区间，整段/图片/封面由 Worker 流式代理。
# 拿回 id 写进 assets.store_id。下载/删除的适配层在 src/policy/storage-download.js。
#
# 首次部署后执行一次建表：
#   wrangler d1 execute favorites --remote --file=src/store/schema.sql
#
# secret 用 `wrangler secret put` 下发：
#   SYNC_TOKEN / MEDIA_KEY_SECRET / STORAGE_TOKEN

name = "favorites-backend"
# 入口同时导出默认路由、DO 和开启 Workers Cache 的 MediaCache entrypoint
main = "src/entry.js"
compatibility_date = "2025-09-01"

[observability]
enabled = true

# 前端由 pages/ 构建到 pages/dist，assets-first；API/媒体路径强制先跑 Worker。
[assets]
directory = "./pages/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/admin/api/*", "/api/*", "/media/*"]

[triggers]
# 每 3 分钟跑任务队列（解析/备份准备/上传），每天回收孤儿 init/source。
crons = ["*/3 * * * *", "41 4 * * *"]

[vars]
BASE_PATH = "/api/v1"
# 管理台独立子域；本地可留空，生产建议填 admin.example.com。
# 管理 API 只在这个 Host 上响应，Cloudflare Access 也应该挂在这个子域。
ADMIN_HOST = ""
INGEST_PATH = "/ingest/callback"
INGEST_SOURCE_APP = "第三方"
# 控制库存 favorites/jobs；内容分片 DB_1..DB_N 存 assets/variants/sources/inits
SHARD_COUNT = "9"
SLICE_SERVICE_URL = ""
UPLOAD_MAX_ATTEMPTS = "3"
UPLOAD_WAIT_MS = "5000"
# 单条收藏所有视频加起来最多切多少片；超出片数预算的视频退回整片，
# 保证免费版 10ms CPU 与 D1 行数可控（18MB/片 × 50 ≈ 900MB）。
MAX_SLICES_PER_FAVORITE = "50"
# 免费版一次调用最多 50 个子请求：每轮只跑一小批，剩下的下一轮（3 分钟后）接着领。
JOBS_PER_TICK = "4"
UPLOAD_JOBS_PER_TICK = "2"
UPLOAD_ITEMS_PER_TICK = "20"
# 一次上传要复制 10×18MB；锁必须长于一次存储调用，否则下一轮会重复领。
UPLOAD_JOB_LOCK_MS = "600000"
# 外部存储服务（上传接口单次最多 10 条）
# 默认不备份视频封面；设为 "true" 后每个视频额外上传一张封面备份。
BACKUP_COVERS = "false"
# 默认所有 backup 的上传地址都走 Worker；设 false 时短视频/备用图/封面直传源站，
# 切片仍必须走 Worker 的合成地址。
STORAGE_MEDIA_VIA_WORKER = "true"
# primary 视频进入 Workers Cache 的阈值；backup 全部缓存，不受此值影响。
# 0 = 不缓存 primary 视频。
PRIMARY_CACHE_MAX_BYTES = "18874368"
# 所有 backup 都走 Worker 时，这里必须公网可达；存储服务要从这里回源复制。
MEDIA_BASE_URL = "https://REPLACE_WITH_YOUR_WORKER.workers.dev/api/v1"
STORAGE_UPLOAD_URL = ""
STORAGE_GET_URL = ""
STORAGE_BATCH_SIZE = "10"
STORAGE_TIMEOUT_MS = "300000"

# Workers Cache：默认入口关闭，只有 MediaCache entrypoint 开启。
# 可缓存媒体在 key 前加内部 c_ 标记，普通 Range 媒体加 n_；App 侧仍是 /media/<key>。
# 所有 backup 缓存；primary 视频按 PRIMARY_CACHE_MAX_BYTES 阈值判断。
[cache]
enabled = false
cross_version_cache = true

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.MediaCache]
type = "worker"

  [exports.MediaCache.cache]
  enabled = true

[[d1_databases]]
binding = "DB"
database_name = "favorites"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 内容分片：每个库执行同一份 schema；DB 只存 favorites/jobs，DB_1.. 只存内容表。
[[d1_databases]]
binding = "DB_1"
database_name = "favorites-1"
database_id = "REPLACE_WITH_YOUR_D1_ID_1"

[[d1_databases]]
binding = "DB_2"
database_name = "favorites-2"
database_id = "REPLACE_WITH_YOUR_D1_ID_2"

[[d1_databases]]
binding = "DB_3"
database_name = "favorites-3"
database_id = "REPLACE_WITH_YOUR_D1_ID_3"

[[d1_databases]]
binding = "DB_4"
database_name = "favorites-4"
database_id = "REPLACE_WITH_YOUR_D1_ID_4"

[[d1_databases]]
binding = "DB_5"
database_name = "favorites-5"
database_id = "REPLACE_WITH_YOUR_D1_ID_5"

[[d1_databases]]
binding = "DB_6"
database_name = "favorites-6"
database_id = "REPLACE_WITH_YOUR_D1_ID_6"

[[d1_databases]]
binding = "DB_7"
database_name = "favorites-7"
database_id = "REPLACE_WITH_YOUR_D1_ID_7"

[[d1_databases]]
binding = "DB_8"
database_name = "favorites-8"
database_id = "REPLACE_WITH_YOUR_D1_ID_8"

[[d1_databases]]
binding = "DB_9"
database_name = "favorites-9"
database_id = "REPLACE_WITH_YOUR_D1_ID_9"

# 个人库的 WebSocket 中枢：一个实例持有全部在线连接并广播变更。
# 必须是 SQLite 后端（免费版只支持 SQLite 版 DO）。
[[durable_objects.bindings]]
name = "LIB"
class_name = "LibraryHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LibraryHub"]